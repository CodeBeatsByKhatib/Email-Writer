<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneCraft | AI Tone & Language Transformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <header class="border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-50 bg-slate-950/80">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-500 bg-clip-text text-transparent">
                    ToneCraft
                </span>
            </div>
            
            <a href="https://www.buymeacoffee.com" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 hover:bg-amber-500/20 px-3.5 py-1.5 rounded-full text-xs md:text-sm font-semibold transition-all duration-300">
                <i class="fa-solid fa-mug-hot"></i>
                <span>Buy me a coffee ☕</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 md:py-12 flex-1 w-full flex flex-col justify-center">
        
        <div class="text-center mb-8 space-y-3">
            <h1 class="text-3xl md:text-5xl font-black text-white leading-tight">
                Refine Your Thoughts into <span class="bg-gradient-to-r from-brand-500 to-indigo-400 bg-clip-text text-transparent">Perfect Tone & Language</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
                Transform rough drafts, angry rants, or casual thoughts into professional, firm, or warm emails in seconds.
            </p>
        </div>

        <div class="glass-card rounded-2xl p-4 md:p-6 shadow-2xl space-y-6">
            
            <!-- <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs">
                <label for="apiKeyInput" class="block text-slate-400 mb-1 font-semibold">Google AI Studio API Key (Required for first use):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-brand-500">
                    <button onclick="saveToken()" class="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-lg font-semibold transition-colors">Save</button>
                </div>
            </div> -->

            <div>
                <label for="inputText" class="block text-xs font-semibold text-slate-400 mb-2">Your Raw Thoughts (Type in any language or style):</label>
                <textarea id="inputText" rows="4" 
                    class="w-full bg-slate-900/90 border border-slate-700/60 rounded-xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all resize-none text-sm md:text-base"
                    placeholder="e.g. Im annoyed that the client missed the deadline again, need them to clear payment ASAP without making excuses..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label for="toneSelect" class="block text-xs font-semibold text-slate-400 mb-2">Select Target Tone:</label>
                    <select id="toneSelect" class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-brand-500">
                        <option value="Professional & Diplomatic">💼 Professional & Diplomatic (For important emails)</option>
                        <option value="Firm & Direct">🔥 Firm & Direct (Setting boundaries & claims)</option>
                        <option value="Friendly & Warm">🤝 Friendly & Warm (For close clients & peers)</option>
                        <option value="Persuasive & Sales">🚀 Persuasive & Sales (For pitches & offers)</option>
                    </select>
                </div>

                <div>
                    <label for="langSelect" class="block text-xs font-semibold text-slate-400 mb-2">Target Output Language:</label>
                    <select id="langSelect" class="w-full bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-brand-500">
                        <option value="English">🇬🇧 English</option>
                        <option value="Arabic">🇸🇦 Arabic</option>
                        <option value="German">🇩🇪 German</option>
                        <option value="Spanish">🇪🇸 Spanish</option>
                        <option value="French">🇫🇷 French</option>
                    </select>
                </div>

            </div>

            <button id="generateBtn" onclick="transformTextWithAI()" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold py-3.5 px-6 rounded-xl glow-btn flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-bolt text-amber-300"></i>
                <span>Transform Text Now</span>
            </button>

            <div id="outputSection" class="hidden space-y-3 pt-4 border-t border-slate-800">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-400">Polished Result:</span>
                    <button onclick="copyToClipboard()" class="text-xs text-brand-500 hover:text-brand-400 flex items-center gap-1 font-semibold transition-colors">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copyStatus">Copy Text</span>
                    </button>
                </div>
                <div id="outputText" class="w-full bg-slate-900 border border-brand-500/30 rounded-xl p-4 text-slate-100 text-sm md:text-base leading-relaxed whitespace-pre-wrap">
                </div>
            </div>

        </div>
    </main>

    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>Built with passion by <span class="text-slate-300 font-bold">ToneCraft AI</span> • All rights reserved</p>
    </footer>

    <script>
        async function transformTextWithAI() {
    const input = document.getElementById("inputText").value.trim();
    const tone = document.getElementById("toneSelect").value;
    const language = document.getElementById("langSelect").value;

    if (!input) {
        alert("Please enter your thoughts first!");
        return;
    }

    const btn = document.getElementById("generateBtn");
    const outputSec = document.getElementById("outputSection");
    const outputText = document.getElementById("outputText");

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Crafting response...`;

    const prompt = `
You are an expert writing assistant.

Rewrite the following text.

Tone: ${tone}
Output language: ${language}

Keep the same meaning while improving grammar, clarity and readability.

Text:
${input}
`;

    try {
        const response = await fetch(
            "https://emailwriter.mohamadalkhateeb49.workers.dev/api/generate",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "Unknown API Error");
        }

        const result = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!result) {
            throw new Error("No response returned.");
        }

        outputText.innerText = result;
        outputSec.classList.remove("hidden");

    } catch (err) {
        console.error(err);
        alert(err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = `
            <i class="fa-solid fa-bolt text-amber-300"></i>
            <span>Transform Text Now</span>
        `;
    }
}
    </script>
</body>
</html>
